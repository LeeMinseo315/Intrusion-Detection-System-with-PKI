<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIDS Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap');
    :root {
      --bg: #050a0f; --bg2: #0a1520; --bg3: #0f1e2e;
      --accent: #00d4ff; --accent2: #00ff88;
      --danger: #ff3366; --warning: #ffaa00;
      --text: #c8e0f0; --text-dim: #4a7090;
      --border: rgba(0,212,255,0.15);
      --glow: 0 0 20px rgba(0,212,255,0.3);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Rajdhani',sans-serif; min-height:100vh; }
    body::before {
      content:''; position:fixed; inset:0;
      background-image: linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);
      background-size:40px 40px; pointer-events:none; z-index:0;
    }
    .container { position:relative; z-index:1; max-width:1400px; margin:0 auto; padding:24px; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; padding-bottom:20px; border-bottom:1px solid var(--border); }
    .logo { display:flex; align-items:center; gap:12px; }
    h1 { font-size:22px; font-weight:700; letter-spacing:3px; color:var(--accent); text-transform:uppercase; }
    .subtitle { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--text-dim); letter-spacing:2px; }
    .status-bar { display:flex; align-items:center; gap:20px; font-family:'Share Tech Mono',monospace; font-size:12px; }
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--accent2); box-shadow:0 0 8px var(--accent2); animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .timestamp { color:var(--text-dim); font-size:11px; }
    .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
    .card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:20px; position:relative; overflow:hidden; }
    .card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--accent); }
    .card.danger::before { background:var(--danger); }
    .card.warning::before { background:var(--warning); }
    .card.success::before { background:var(--accent2); }
    .card-label { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px; font-family:'Share Tech Mono',monospace; }
    .card-value { font-size:36px; font-weight:700; color:var(--accent); line-height:1; margin-bottom:6px; }
    .card.danger .card-value { color:var(--danger); }
    .card.warning .card-value { color:var(--warning); }
    .card.success .card-value { color:var(--accent2); }
    .card-sub { font-size:12px; color:var(--text-dim); font-family:'Share Tech Mono',monospace; }
    .charts { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
    .chart-box { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:24px; }
    .chart-title { font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--accent); margin-bottom:20px; display:flex; align-items:center; gap:8px; }
    .chart-title::before { content:''; width:4px; height:16px; background:var(--accent); border-radius:2px; }
    .chart-wrapper { position:relative; height:280px; }
    .table-box { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:24px; }
    .table-title { font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--accent); margin-bottom:20px; display:flex; align-items:center; gap:8px; }
    .table-title::before { content:''; width:4px; height:16px; background:var(--accent); border-radius:2px; }
    table { width:100%; border-collapse:collapse; font-family:'Share Tech Mono',monospace; font-size:12px; }
    th { text-align:left; padding:10px 12px; color:var(--text-dim); border-bottom:1px solid var(--border); letter-spacing:1px; font-size:11px; }
    td { padding:10px 12px; border-bottom:1px solid rgba(0,212,255,0.05); color:var(--text); }
    tr:hover td { background:rgba(0,212,255,0.03); }
    .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:600; letter-spacing:1px; }
    .badge-benign { background:rgba(0,255,136,0.15); color:var(--accent2); border:1px solid rgba(0,255,136,0.3); }
    .badge-ddos { background:rgba(255,51,102,0.15); color:var(--danger); border:1px solid rgba(255,51,102,0.3); }
    .badge-portscan { background:rgba(255,170,0,0.15); color:var(--warning); border:1px solid rgba(255,170,0,0.3); }
    .badge-webattack { background:rgba(180,0,255,0.15); color:#cc66ff; border:1px solid rgba(180,0,255,0.3); }
    .anomaly-true { color:var(--danger); }
    .anomaly-false { color:var(--accent2); }
    .confidence-bar { display:flex; align-items:center; gap:8px; }
    .confidence-track { flex:1; height:4px; background:var(--bg3); border-radius:2px; overflow:hidden; }
    .confidence-fill { height:100%; background:var(--accent); border-radius:2px; }
    .loading { text-align:center; padding:60px; font-family:'Share Tech Mono',monospace; color:var(--text-dim); font-size:14px; }
    .refresh-btn { background:transparent; border:1px solid var(--accent); color:var(--accent); padding:8px 20px; border-radius:6px; cursor:pointer; font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:600; letter-spacing:2px; text-transform:uppercase; transition:all 0.2s; }
    .refresh-btn:hover { background:var(--accent); color:var(--bg); }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <div>
        <h1>NIDS Monitor</h1>
        <div class="subtitle">Network Intrusion Detection System · mTLS Pipeline</div>
      </div>
    </div>
    <div class="status-bar">
      <div class="status-dot"></div>
      <span>SYSTEM ONLINE</span>
      <span class="timestamp" id="timestamp"></span>
      <button class="refresh-btn" onclick="loadData()">REFRESH</button>
    </div>
  </header>
  <div id="content"><div class="loading">데이터 로딩 중...</div></div>
</div>
<script>
  function updateTimestamp() {
    document.getElementById('timestamp').textContent = new Date().toLocaleString('ko-KR');
  }
  updateTimestamp();
  setInterval(updateTimestamp, 1000);

  async function loadData() {
    try {
      const res = await fetch('/predictions');
      if (!res.ok) throw new Error('predictions.json 없음');
      const data = await res.json();
      render(data);
    } catch(e) {
      document.getElementById('content').innerHTML = '<div style="text-align:center;padding:40px;color:#ff3366;font-family:monospace;">⚠ 데이터 로드 실패: ' + e.message + '</div>';
    }
  }

  function getBadgeClass(p) {
    return {'BENIGN':'badge-benign','DDoS':'badge-ddos','PortScan':'badge-portscan','Web Attack':'badge-webattack'}[p] || 'badge-benign';
  }

  function render(data) {
    const total = data.length;
    const attackCount = data.filter(d => d.prediction !== 'BENIGN').length;
    const anomalyCount = data.filter(d => d.is_anomaly).length;
    const attackRate = ((attackCount/total)*100).toFixed(1);
    const cc = {'BENIGN':0,'DDoS':0,'PortScan':0,'Web Attack':0};
    data.forEach(d => { if(cc[d.prediction]!==undefined) cc[d.prediction]++; });
    const recent = data.slice(0,20);

    document.getElementById('content').innerHTML = `
      <div class="cards">
        <div class="card"><div class="card-label">Total Analyzed</div><div class="card-value">${total}</div><div class="card-sub">network flows</div></div>
        <div class="card danger"><div class="card-label">Attacks Detected</div><div class="card-value">${attackCount}</div><div class="card-sub">malicious flows</div></div>
        <div class="card warning"><div class="card-label">Anomalies (IF)</div><div class="card-value">${anomalyCount}</div><div class="card-sub">isolation forest</div></div>
        <div class="card success"><div class="card-label">Attack Rate</div><div class="card-value">${attackRate}%</div><div class="card-sub">of total traffic</div></div>
      </div>
      <div class="charts">
        <div class="chart-box"><div class="chart-title">Traffic Classification</div><div class="chart-wrapper"><canvas id="donutChart"></canvas></div></div>
        <div class="chart-box"><div class="chart-title">Attack Distribution</div><div class="chart-wrapper"><canvas id="barChart"></canvas></div></div>
      </div>
      <div class="table-box">
        <div class="table-title">Recent Detections (Latest 20)</div>
        <table>
          <thead><tr><th>#</th><th>Timestamp</th><th>Prediction</th><th>Actual</th><th>Confidence</th><th>Anomaly</th><th>Score</th></tr></thead>
          <tbody>${recent.map(d=>`<tr>
            <td>${d.id}</td><td>${d.timestamp}</td>
            <td><span class="badge ${getBadgeClass(d.prediction)}">${d.prediction}</span></td>
            <td><span class="badge ${getBadgeClass(d.actual)}">${d.actual}</span></td>
            <td><div class="confidence-bar"><div class="confidence-track"><div class="confidence-fill" style="width:${(d.confidence*100).toFixed(0)}%"></div></div><span>${(d.confidence*100).toFixed(0)}%</span></div></td>
            <td class="${d.is_anomaly?'anomaly-true':'anomaly-false'}">${d.is_anomaly?'⚠ YES':'✓ NO'}</td>
            <td>${d.anomaly_score}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>`;

    new Chart(document.getElementById('donutChart'),{
      type:'doughnut',
      data:{
        labels:['BENIGN','DDoS','PortScan','Web Attack'],
        datasets:[{data:[cc['BENIGN'],cc['DDoS'],cc['PortScan'],cc['Web Attack']],
          backgroundColor:['rgba(0,255,136,0.8)','rgba(255,51,102,0.8)','rgba(255,170,0,0.8)','rgba(180,0,255,0.8)'],
          borderColor:['#00ff88','#ff3366','#ffaa00','#cc66ff'],borderWidth:2}]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#c8e0f0',font:{family:'Rajdhani',size:13},padding:16}}},cutout:'65%'}
    });

    new Chart(document.getElementById('barChart'),{
      type:'bar',
      data:{
        labels:['DDoS','PortScan','Web Attack'],
        datasets:[{label:'Count',data:[cc['DDoS'],cc['PortScan'],cc['Web Attack']],
          backgroundColor:['rgba(255,51,102,0.7)','rgba(255,170,0,0.7)','rgba(180,0,255,0.7)'],
          borderColor:['#ff3366','#ffaa00','#cc66ff'],borderWidth:2,borderRadius:6}]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{ticks:{color:'#c8e0f0',font:{family:'Rajdhani',size:13}},grid:{color:'rgba(0,212,255,0.05)'}},
          y:{ticks:{color:'#4a7090'},grid:{color:'rgba(0,212,255,0.05)'},beginAtZero:true}}}
    });
  }
  loadData();
</script>
</body>
</html>
